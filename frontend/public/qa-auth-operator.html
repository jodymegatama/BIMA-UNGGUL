<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>qa-auth-operator</title></head>
<body>
<script>
(async () => {
  try {
    const res = await fetch('http://localhost:3000/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nip: '19940131QA202508', password: 'QaOper12345' })
    });
    const data = await res.json();
    if (!res.ok) { document.title = 'LOGIN-FAILED'; document.body.textContent = JSON.stringify(data); return; }
    localStorage.setItem('accessToken', data.accessToken);
    localStorage.setItem('token', data.accessToken);
    localStorage.setItem('authUser', JSON.stringify(data.user));
    document.title = 'QA-AUTH-OK';
    document.body.textContent = 'OK ' + (data.user ? data.user.role : '?');
  } catch (e) {
    document.title = 'FETCH-ERROR';
    document.body.textContent = String(e);
  }
})();
</script>
</body>
</html>
