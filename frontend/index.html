<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistem Informasi Input, Validasi, dan Pemeringkatan Capaian Mutu Madrasah — Kemenag Kabupaten Pasuruan." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Nunito+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <title>BIMA UNGGUL — Bina Madrasah Unggul</title>
    <script>
      // Theme init SEBELUM paint (anti-FOUC): localStorage > prefers-color-scheme
      (function () {
        try {
          var t = localStorage.getItem('bima-theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) { /* private mode — tetap light */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
